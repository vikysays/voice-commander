# Voice Commander Configuration for Omarchy + Superwhisper + Samson GoMic

[general]
# Wake words that trigger a command even when in Dictation Mode (case-insensitive)
wake_words = ["computer", "jarvis", "omarchy", "command", "system", "assistant", "agent"]

# Default operating mode on startup:
# - "hybrid": (Recommended) Commands execute actions; dictation requires saying "Type <text>" or switching to "Dictation mode", so background noise NEVER types random sentences!
# - "command": Only executes commands unless prefixed with "type" or "dictate".
# - "dictation": Everything is typed unless prefixed with a wake word ("computer ...") or "command mode".
default_mode = "hybrid"

# In Hybrid Mode, require "type <text>" / "write <text>" (or switching to "dictation mode") before typing arbitrary sentences.
# This prevents ambient conversation, background TV/phone audio, or Whisper hallucinations from typing random text into your windows!
require_type_prefix_in_hybrid = true

# Show desktop notifications (OSD) for recognized commands and mode switches
notifications = true

# Show live OSD recording timer & audio meter while you are speaking
live_osd = true

# Audio device for hands-free Voice Activity Detection (Samson GoMic)
audio_device = "alsa_input.usb-Samson_Technologies_Samson_GoMic-00.analog-stereo"

[vad]
# Enable hands-free voice activity detection on startup
enabled = true
# Sample rate in Hz
sample_rate = 16000
# Minimum RMS threshold to trigger speech start (filters out room noise and keyboard clacks)
energy_threshold = 3400
# Adaptive noise floor multiplier
start_multiplier = 2.8
# Adaptive stop hysteresis
stop_multiplier = 1.7
# Consecutive speech chunks (100ms each) required to trigger recording (3 chunks = 300ms sustained human voice, filters out short 50ms clicks/coughs)
speech_start_chunks = 3
# Silence duration (seconds) after you finish a sentence to automatically stop & process immediately!
silence_stop_seconds = 0.70
# Maximum single recording duration (seconds) for hands-free trigger
max_record_seconds = 14.0
# Cooldown after stopping a recording before VAD starts listening again (seconds)
cooldown_seconds = 1.2

